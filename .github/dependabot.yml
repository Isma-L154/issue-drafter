version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # A compromised or broken release is usually pulled within days.
    # Security updates ignore the cooldown.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    ignore:
      # Follows the major of the Node that ci.yml and deploy.yml run.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      toolchain:
        patterns: ["*"]
  # Actions are pinned by digest; this is what moves the pins.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
