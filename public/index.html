<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Issue Drafter</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <h1>Issue Drafter</h1>

    <section class="card">
      <label for="repo">Repository</label>
      <select id="repo" required><option value="">Loading...</option></select>

      <label for="type">Type</label>
      <select id="type">
        <option value="auto">Auto</option>
        <option value="bug">Bug</option>
        <option value="feature">Feature</option>
        <option value="task">Task</option>
      </select>

      <label for="note">Note, in your own words</label>
      <textarea id="note" rows="7" maxlength="4000"></textarea>

      <button id="generate" type="button">Generate</button>
    </section>

    <section id="preview" class="card" hidden>
      <p class="meta">Detected type: <strong id="detected-type"></strong></p>

      <label for="title">Title</label>
      <input id="title" type="text" maxlength="120">

      <label for="body">Body</label>
      <textarea id="body" rows="18"></textarea>

      <label for="correction">Correction</label>
      <textarea id="correction" rows="3" maxlength="4000"></textarea>
      <div class="actions">
        <button id="correct" type="button" class="secondary">Correct</button>
        <button id="publish" type="button">Publish</button>
      </div>
    </section>

    <p id="status" role="status" aria-live="polite"></p>
    <p><a id="result" hidden target="_blank" rel="noopener noreferrer"></a></p>
  </main>
</body>
</html>
